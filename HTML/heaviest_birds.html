<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heaviest_birds Table</title>
  </head>
  <body>
    <h1>Heaviest_birds</h1>
    <table>
      <thead>
        <tr>
          <th>Animal</th>
          <th>Average mass [kg(lb)]</th>
          <th>Maximum mass [kg(lb)]</th>
          <th>flighted</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Ostrich</td>
          <td>104(230)</td>
          <td>156.9(340)</td>
          <td>No</td>
        </tr>
        <tr>
          <td>Somali Ostrich</td>
          <td>90(200)</td>
          <td>130 (283)</td>
          <td>No</td>
        </tr>
      </tbody>
    </table>
    <h2>V2</h2>
    <table>
      <thead>
        <tr>
          <th rowspan="2">Animal</th>
          <th colspan="2">Average Mass</th>
          <th rowspan="2">flighted</th>
        </tr>
        <tr>
          <th>KG</th>
          <th>BL</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Ostrich</td>
          <td>104</td>
          <td>203</td>
          <td>No</td>
        </tr>
        <tr>
          <td>Somali Ostrich</td>
          <td>90</td>
          <td>200</td>
          <td>No</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
