<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms Demo</title>
  </head>
  <body>
    <h1>Forms Demo</h1>
    <hr />
    <button>outside form</button>
    <form action="/tacos">
      <button>another button</button>
      <button type="button">tyoebottun</button>
      <p>
        <label for="username">Enter Username:</label>
        <input
          id="username"
          type="text"
          placeholder="username"
          name="username"
        />
      </p>
      <p>
        <label for="password">Enter Password:</label>
        <input
          id="password"
          type="password"
          placeholder="password"
          name="password"
        />
      </p>
      <p>
        <label for="color">Enter color</label>
        <input id="color" type="color" name="color" />
      </p>
      <p>
        <label
          >Enter number:
          <input
            type="number"
            placeholder="enter number"
            name="number"
            min="1"
            max="50"
          />
        </label>
      </p>
      <input type="time" />
      <input type="checkbox" />
      <button>submit</button>
      <input type="submit" value="Click submit" />
    </form>
    <hr />
    <h2>Hijacking Searchs</h2>
    <h3>search Reddit</h3>
    <form action="https://www.reddit.com/search">
      <input type="text" name="q" />
      <button>Search Reddit</button>
    </form>
    <h3>search Google</h3>
    <form action="https://www.google.com/search">
      <input type="text" name="q" />
      <button>Search Google</button>
    </form>
    <h3>search Youtube</h3>
    <form action="https://www.youtube.com/results">
      <input type="text" name="search_query" />
      <button>Search Youtube</button>
    </form>
    <hr />
    <h2>more Inputs</h2>
    <form action="/birds">
      <input type="checkbox" name="agree_tos" id="agree" checked />
      <label for="agree">I agree to everything</label>
      <p>
        <label for="xs">xs:</label>
        <input type="radio" name="size" id="xs" value="xs" />
        <label for="s">s:</label>
        <input type="radio" name="size" id="s" value="s" />
        <label for="m">m:</label>
        <input type="radio" name="size" id="m" value="m" />
      </p>
      <p>
        <label for="">Please Select an Entree</label>
        <select name="meal" id="meal">
          <option value="fish" selected>fish</option>
          <option value="veg">vegetarian</option>
          <option value="steak">steak</option>
        </select>
      </p>
      <p>
        <label for="cheese">amount of cheese:</label>
        <input
          type="range"
          id="cheese"
          min="1"
          max="100"
          value="70"
          name="cheese_label"
        />
      </p>

      <p>
        <label for="requests">Any Special Request</label>
        <br />
        <textarea
          name="requests?"
          id="requests"
          rows="10"
          cols="40"
          placeholder="type something here"
        ></textarea>
      </p>
      <button>submit</button>
    </form>
    <h2>Validations Demo</h2>
    <form action="/dummy">
      <label for="" first>enter first name</label>
      <input type="text" id="first" name="first" required />
      <p>
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          minlength="5"
          maxlength="20"
          required
        />
      </p>
      <p>
        <input type="email" required placeholder="email" />
        <input type="url" placeholder="url" />
      </p>
      <button>submit</button>
    </form>
  </body>
</html>
